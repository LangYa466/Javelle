name: verify

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build compiler
        run: go build ./... && go vet ./...
      - name: End-to-end tests
        run: go test ./... -count=1
      - name: Smoke test the CLI
        run: |
          go build -o /tmp/teyru ./cmd/teyru
          printf 'class Hello {\n  public static void main(String[] args) {\n    System.out.println("Hello, Teyru!")\n  }\n}\n' > /tmp/Hello.teyru
          /tmp/teyru run /tmp/Hello.teyru | grep -q 'Hello, Teyru!'
